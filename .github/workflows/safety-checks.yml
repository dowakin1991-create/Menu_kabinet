name: KABINET safety checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-tests:
    name: JavaScript and Firebase rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: JavaScript regression tests
        run: npm test
      - name: Firestore permissions in isolated emulator
        run: npm run test:rules
