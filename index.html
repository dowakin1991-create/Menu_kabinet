<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">

        * {

            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #0a1128 0%, #000000 100%);

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            text-align: center;
        }

        /* Екрани */
        #start-screen, #result-screen {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #c0a062;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(192, 160, 98, 0.5);
        }

        h1 {
            color: #e0b976;
            margin-bottom: 20px;
            font-size: 2.5rem;
            text-shadow: 0 0 10px rgba(224, 185, 118, 0.8);
        }

        p.desc {
            margin-bottom: 30px;
            color: #b0c4de;
            font-size: 1.1rem;
        }

        /* Кнопки вибору складності */
        .level-btn {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 15px;
            background: linear-gradient(90deg, #1a2a6c, #112240, #1a2a6c);
            border: 2px solid #c0a062;
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.3s ease;
        }

        .level-btn:hover {
            background: linear-gradient(90deg, #c0a062, #e0b976, #c0a062);
            color: #000;
            box-shadow: 0 0 15px #c0a062;
        }

        /* Ігровий екран */
        #game-area {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            color: #e0b976;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .question-box {
            background: linear-gradient(180deg, #0f204b, #050a1f);
            border: 3px solid #c0a062;
            border-radius: 15px;
            padding: 30px 20px;
            width: 100%;
            font-size: 1.4rem;
            font-weight: bold;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 15px rgba(192, 160, 98, 0.4);
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: linear-gradient(180deg, #0f204b, #050a1f);
            border: 2px solid #c0a062;
            color: #fff;
            padding: 15px 20px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 40px;
            position: relative;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            text-align: left;
        }

        .option-btn::before {
            content: attr(data-letter) ": ";
            color: #e0b976;
            font-weight: bold;
            margin-right: 10px;
            font-size: 1.2rem;
        }

        .option-btn:hover:not(.disabled) {
            background: #c0a062;
            color: #000;
        }

        .option-btn:hover:not(.disabled)::before {
            color: #000;
        }

        /* Стани кнопок після відповіді */
        .option-btn.selected {
            background: orange;
            color: #000;
            border-color: #fff;
        }

        .option-btn.correct {
            background: linear-gradient(180deg, #28a745, #1e7e34) !important;
            color: #fff !important;
            border-color: #fff !important;
            animation: pulse-green 0.5s 3;
        }
        .option-btn.correct::before { color: #fff !important; }

        .option-btn.wrong {
            background: linear-gradient(180deg, #dc3545, #a71d2a) !important;
            color: #fff !important;
            border-color: #fff !important;
        }
        .option-btn.wrong::before { color: #fff !important; }

        .option-btn.disabled {
            pointer-events: none;
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(40, 167, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0); }
        }

        #next-btn {
            display: none;
            padding: 15px 40px;
            background: #e0b976;
            color: #000;
            font-weight: bold;
            font-size: 1.2rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
        }
        #next-btn:hover { background: #fff; }

        .feedback {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: -15px;
            min-height: 35px;
        }
    </style>
</head>

            </div>

        ["Які спеції та соуси у 'Файній бульбі з рваною свининою'?", "Маринована цибуля, халапеньйо, сирний соус, зелень", "Часник, перець чилі, соус BBQ, кріп", "Кримська цибуля, паприка, соус Айолі, кінза", "В'ялені томати, каперси, соус тартар, рукола"],
        ["З чого складається чай 'Маракуйя-апельсин'?", "Маракуйя, апельсин, лимонний фреш, апельсиновий сироп", "Маракуйя, апельсин, мед, м'ята", "Пюре маракуйї, апельсиновий сік, імбир, кориця", "Маракуйя, лайм, сироп блю курасао, чорний чай"],
        ["Який склад 'Піци По-селянськи'?", "Соус неаполітано, моцарела, салямі, мисливські ковбаски, куряче філе, квашений огірок, цибуля, часникова олія", "Соус BBQ, моцарела, бекон, картопля фрі, сир чеддер, зелена цибуля", "Вершковий соус, моцарела, рвана свинина, печериці, солоний огірок, гірчиця", "Соус неаполітано, моцарела, прошуто, томати, рукола, песто"]
    ];

    // Змінні гри
    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let maxQuestions = 10;
    let currentCategory = '';

    // Аудіо контекст для синтезу звуків
    let audioCtx;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
            // Звук дзинькання (перемога)
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.2); // C6
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        } else {
            // Звук помилки (баззер)
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }
    }

    // Утиліта для перемішування масиву (Fisher-Yates)
    function shuffleArray(array) {
        let curId = array.length;
        while (0 !== curId) {
            let randId = Math.floor(Math.random() * curId);
            curId -= 1;
            let tmp = array[curId];
            array[curId] = array[randId];
            array[randId] = tmp;
        }
        return array;
    }

    function startGame(level) {
        initAudio();
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('game-area').style.display = 'flex';
        
        score = 0;
        currentQuestionIndex = 0;

        let sourceDb = [];
        if (level === 'easy') {
            sourceDb = dbEasy;
            maxQuestions = 10;
            currentCategory = 'Легкий';
        } else if (level === 'medium') {
            sourceDb = dbMedium;
            maxQuestions = 10;
            currentCategory = 'Середній';
        } else if (level === 'hard') {
            sourceDb = dbHard;
            maxQuestions = 15;
            currentCategory = 'ХАРДКОР';
        }

        document.getElementById('level-display').innerText = `Рівень: ${currentCategory}`;

        // Вибираємо випадкові питання з бази
        let shuffledDb = shuffleArray([...sourceDb]);
        currentQuestions = shuffledDb.slice(0, maxQuestions);

        loadQuestion();
    }

    function loadQuestion() {
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('feedback-text').innerText = '';
        const optionsArea = document.getElementById('options-area');
        optionsArea.innerHTML = '';

        document.getElementById('progress-display').innerText = `Питання ${currentQuestionIndex + 1} з ${maxQuestions}`;

        const qData = currentQuestions[currentQuestionIndex];
        document.getElementById('question-text').innerText = qData[0];

        // Готуємо масив відповідей з позначкою правильності
        let options = [
            { text: qData[1], isCorrect: true },
            { text: qData[2], isCorrect: false },
            { text: qData[3], isCorrect: false },
            { text: qData[4], isCorrect: false }
        ];

        // ПЕРЕМІШУЄМО ВІДПОВІДІ
        options = shuffleArray(options);
        
        const letters = ['A', 'B', 'C', 'D'];

        options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt.text;
            btn.setAttribute('data-letter', letters[index]);
            btn.onclick = () => checkAnswer(btn, opt.isCorrect, optionsArea);
            optionsArea.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, isCorrect, optionsContainer) {
        // Блокуємо всі кнопки
        const allBtns = optionsContainer.querySelectorAll('.option-btn');
        allBtns.forEach(btn => btn.classList.add('disabled'));

        selectedBtn.classList.add('selected');

        // Невелика затримка для ефекту напруги "мільйонера"
        setTimeout(() => {
            if (isCorrect) {
                selectedBtn.classList.remove('selected');
                selectedBtn.classList.add('correct');
                document.getElementById('feedback-text').innerText = "Правильно!";
                document.getElementById('feedback-text').style.color = "#28a745";
                score++;
                playSound('correct');
            } else {
                selectedBtn.classList.remove('selected');
                selectedBtn.classList.add('wrong');
                document.getElementById('feedback-text').innerText = "Помилка!";
                document.getElementById('feedback-text').style.color = "#dc3545";
                playSound('wrong');
                
                // Підсвічуємо правильну
                allBtns.forEach(btn => {
                    // Звіряємо текст кнопки з текстом правильної відповіді у масиві поточного питання
                    const correctAnswerText = currentQuestions[currentQuestionIndex][1];
                    if (btn.innerText === correctAnswerText) {
                        btn.classList.add('correct');
                    }
                });
            }
            document.getElementById('next-btn').style.display = 'block';
        }, 1000); // 1 секунда інтриги
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < maxQuestions) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('game-area').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        
        document.getElementById('final-score').innerText = `Твій рахунок: ${score} / ${maxQuestions}`;
        
        let percent = (score / maxQuestions) * 100;
        let analytics = "";

        if (percent === 100) {
            analytics = "Ідеально! Ти знаєш це меню як власний паспорт. Можна сміливо йти на здачу!";
            document.getElementById('analytics').style.color = "#28a745";
        } else if (percent >= 70) {
            analytics = "Хороший результат. Основу ти знаєш, але деякі нюанси ще плавають. Спробуй ще раз хардкор-режим.";
            document.getElementById('analytics').style.color = "#e0b976";
        } else {
            analytics = "Поки слабкувато. Гість би залишився незадоволений. Треба ще зубрити!";
            document.getElementById('analytics').style.color = "#dc3545";
        }

        document.getElementById('analytics').innerText = analytics;
    }
</script>
