<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f7474">
  <meta name="description" content="Робочий графік команди KABINET">
  <title>KABINET — графік</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <img src="assets/logo.svg" alt="Логотип KABINET">
        <div><strong>KABINET</strong><span>графік команди</span></div>
      </div>
      <nav class="month-nav" aria-label="Навігація місяцями">
        <button class="icon-btn" id="previous-month" type="button" aria-label="Попередній місяць">←</button>
        <div class="month-title" id="month-title">…</div>
        <button class="icon-btn" id="next-month" type="button" aria-label="Наступний місяць">→</button>
      </nav>
      <div class="top-actions">
        <div class="status" id="connection-status"><span>Підключення…</span></div>
        <button class="button small" id="today" type="button">Сьогодні</button>
      </div>
    </header>

    <section class="toolbar" aria-label="Керування графіком">
      <div class="field profile-field">
        <label for="employee-select">Мій профіль</label>
        <select id="employee-select"><option value="">Оберіть своє ім’я</option></select>
      </div>
      <button class="button" id="edit-availability" type="button" disabled>Позначити бажаний вихідний</button>
      <div class="spacer"></div>
      <button class="button ghost" id="share" type="button">Поділитися графіком</button>
    </section>

    <button class="button" id="copy-access" type="button">Скопіювати мій код доступу</button>
    <p>Передайте код адміністратору для дозволу редагувати свої вихідні.</p>
    <div class="notice" id="edit-hint">Оберіть своє ім’я. Після цього можна буде позначити бажані вихідні.</div>

    <section class="table-card" aria-label="Таблиця робочого графіка">
      <div class="table-scroll" id="table-scroll">
        <table class="schedule" id="schedule"></table>
      </div>
    </section>

    <div class="legend" aria-label="Умовні позначення">
      <span><i class="shift full"></i> повний день</span>
      <span><i class="shift first"></i> перша половина</span>
      <span><i class="shift second"></i> друга половина</span>
      <span><i class="dot"></i> бажаний вихідний</span>
    </div>
  </main>

  <div class="modal-backdrop" id="employee-modal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="employee-modal-title">
      <div class="modal-header">
        <h2 id="employee-modal-title">Працівник</h2>
        <button class="icon-btn" type="button" data-close="employee-modal" aria-label="Закрити">×</button>
      </div>
      <div class="stats">
        <div class="stat">Зміни 1–15<strong id="first-half">0</strong></div>
        <div class="stat">Зміни 16–31<strong id="second-half">0</strong></div>
      </div>
      <div class="modal-actions"><button class="button" type="button" data-close="employee-modal">Закрити</button></div>
    </section>
  </div>

  <div class="modal-backdrop" id="confirm-modal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="modal-header"><h2 id="confirm-title">Підтвердження</h2></div>
      <p id="confirm-message"></p>
      <div class="modal-actions">
        <button class="button ghost" type="button" data-close="confirm-modal">Скасувати</button>
        <button class="button primary" id="confirm-action" type="button">Підтвердити</button>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" id="banquet-modal" hidden>
    <section class="modal wide" role="dialog" aria-modal="true" aria-labelledby="banquet-title">
      <div class="modal-header">
        <h2 id="banquet-title">Бенкет</h2>
        <button class="icon-btn" type="button" data-close="banquet-modal" aria-label="Закрити">×</button>
      </div>
      <p id="banquet-details"></p>
      <div class="receipts" id="banquet-receipts"></div>
      <div class="modal-actions"><button class="button" type="button" data-close="banquet-modal">Закрити</button></div>
    </section>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
